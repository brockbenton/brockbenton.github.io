title: Brock Benton
description: CS + economics at CU Boulder. Blockchain, agentic AI, and the foundations of economics.
url: https://brockbenton.com
baseurl: ""
lang: en

author:
  name: Brock Benton
  email: brockbentons@gmail.com
  github: brockbenton
  linkedin: brockbenton

resume: /assets/pdf/resume/resume.pdf

permalink: /blog/:year/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - _news # parked until the news section comes back
  - vendor
