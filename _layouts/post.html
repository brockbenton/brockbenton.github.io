---
layout: default
---
<article class="prose">
  <a class="back" href="{{ '/blog/' | relative_url }}">← blog</a>
  <h1>{{ page.title }}</h1>
  <p class="meta">
    {{ page.date | date: "%b %-d, %Y" }}{% if page.author and page.author != site.author.name %} · {{ page.author }}{% endif %}
  </p>
  {{ content }}
</article>
